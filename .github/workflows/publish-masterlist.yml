name: Publish master blocklist

on:
  push:
    branches: [main]
    paths:
      - 'masterlist-part-*.txt'
      - 'scripts/build-masterlist.sh'
      - '.github/workflows/publish-masterlist.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-master-blocklist
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and verify master list
        run: bash scripts/build-masterlist.sh "$RUNNER_TEMP/masterlist-release"

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/masterlist-release"
          sha256sum -c masterlist.txt.sha256
          tag="blocklist-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The CLI uploads assets to a draft before publishing the release.
          # Keep older releases intact so a failed upload cannot delete them.
          gh release create "$tag" masterlist.txt masterlist.txt.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Master blocklist ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md \
            --latest
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          printf '\nSubscription: https://github.com/%s/releases/latest/download/masterlist.txt\n' \
            "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
